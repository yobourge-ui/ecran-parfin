const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const hl = s => { const t = esc(s); return CONFIG.CLUB_MATCH.test(s) ? `<span class="hl">${t}</span>` : t; };
const hlFree = s => esc(s).replace(/((?:FC\s+)?parfin(?:\s+(?:St|SA|Saint)[\w\s-]*?)?(?:\s*\d+)?)(?=$|[\s,;:().])/gi, '<span class="hl">$1</span>');

function nowLocal(){ // "maintenant" à l'heure de La Réunion
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.TIMEZONE,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => +p.find(x=>x.type===t).value;
  return new Date(g("year"), g("month")-1, g("day"), g("hour")%24, g("minute"), g("second"));
}
function today0(){ const d = nowLocal(); d.setHours(0,0,0,0); return d; }

function parseDate(v){
  if (v instanceof Date) return v;
  if (v == null || v === "") return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) return new Date(+(m[3].length===2?"20"+m[3]:m[3]), +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}
function fmtHour(v){
  if (v == null || v === "") return "";
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})\s*[:hH]\s*(\d{2})?/);
  return m ? `${m[1].padStart(2,"0")}h${m[2]||"00"}` : s;
}
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmtDayLong = d => `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtDayShort = d => `${DAYS[d.getDay()].slice(0,3)}. ${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`;
function catRank(c){
  const n = String(c||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
  let i = CONFIG.CATEGORY_ORDER.indexOf(n);
  if (i < 0) i = CONFIG.CATEGORY_ORDER.findIndex(k => n.startsWith(k));
  return i < 0 ? 999 : i;
}
function driveImg(url){ // transforme un lien de partage Google Drive en image affichable
  if (!url) return "";
  const m = String(url).match(/(?:\/d\/|id=)([\w-]{20,})/);
  return (m && /drive\.google/.test(url)) ? `https://lh3.googleusercontent.com/d/${m[1]}=w800` : url;
}
function driveFallback(url){ // second format si le premier ne s'affiche pas
  const m = String(url||"").match(/(?:\/d\/|id=)([\w-]{20,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800` : "";
}

// Lecture par JSONP (fonctionne aussi depuis un fichier local, sans souci de CORS).
// Le classeur doit être partagé « Toute personne disposant du lien : lecteur ».
function cellVal(c, type){
  if (!c || c.v == null) return "";
  const v = c.v;
  if (Array.isArray(v)) return `${String(v[0]).padStart(2,"0")}:${String(v[1]).padStart(2,"0")}`; // timeofday
  if (typeof v === "string"){
    const m = v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+)(?:,(\d+))?)?\)$/);
    if (m){
      if (+m[1] <= 1900 && m[4] != null) return `${m[4].padStart(2,"0")}:${(m[5]||"0").padStart(2,"0")}`; // heure seule
      return new Date(+m[1], +m[2], +m[3]);
    }
    return v;
  }
  if (typeof v === "number" && type === "number") return Number.isInteger(v) ? v : (c.f ?? v);
  return c.f ?? v;
}
function loadSheet(name){
  return new Promise((resolve, reject) => {
    const cb = "gv_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error("délai dépassé : " + name)); }, 20000);
    window[cb] = resp => {
      done();
      if (!resp || resp.status === "error") return reject(new Error("onglet introuvable : " + name));
      const cols = resp.table.cols;
      let heads = cols.map(c => norm(c.label));
      let rows = resp.table.rows || [];
      if (heads.every(h => !h) && rows.length){ heads = rows[0].c.map(c => norm(c && (c.v ?? ""))); rows = rows.slice(1); }
      resolve(rows.map(r => {
        const o = {};
        heads.forEach((h, i) => { if (h) o[h] = cellVal(r.c[i], cols[i].type); });
        return o;
      }).filter(o => Object.values(o).some(v => v !== "")));
    };
    s.onerror = () => { done(); reject(new Error("réseau")); };
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
const TABS = {dujour:"DuJour", matchs:"Matchs", resultats:"Resultats", rdv:"RDV", annonces:"Annonces", partenaires:"Partenaires"};

}

/* ===================== CONSTRUCTION DES ÉCRANS ===================== */
function paginate(items, cap){ // items: {w, html}
  const pages = []; let cur = [], w = 0;
  for (let k = 0; k < items.length; k++){
    const it = items[k];
    if (it.head && cur.length){   // un groupe (jour · moment) qui tient sur une page ne doit pas être coupé
      let gw = it.w; for (let j = k+1; j < items.length && !items[j].head; j++) gw += items[j].w;
      if (w + gw > cap && gw <= cap){ pages.push(cur); cur = []; w = 0; }
    }
    if (w + it.w > cap && cur.length){
      const tail = [];   // ne jamais laisser un titre de groupe seul en bas de page
      while (cur.length > 1 && cur[cur.length-1].head) tail.unshift(cur.pop());
      pages.push(cur); cur = tail; w = tail.reduce((t,x)=>t+x.w,0);
    }
    cur.push(it); w += it.w;
  }
  if (cur.length) pages.push(cur);
  return pages;
}
function head(title, sub, i, n){
  return `<div class="stitle"><h2>${esc(title)}</h2>${sub?`<div class="sub">${esc(sub)}</div>`:""}${n>1?`<div class="page">${i+1}/${n}</div>`:""}</div>`;
}

function slidesMatchs(){
  const t0 = today0(), tEnd = new Date(t0); tEnd.setDate(tEnd.getDate() + CONFIG.MATCH_DAYS_AHEAD);
  let list = (DATA.matchs||[]).map(m => ({...m, _d: parseDate(m.date)})).filter(m => m._d);
  let sel = isDemo ? list : list.filter(m => m._d >= t0 && m._d <= tEnd);
  let sub = "";
  if (!sel.length){ sel = list.filter(m => m._d >= t0).sort((a,b)=>a._d-b._d).slice(0,12); sub = "Prochains matchs"; }
  if (!sel.length) return [];
  const hm = h => { const m = String(h||"").match(/(\d{1,2})\D*(\d{2})?/); return m ? (+m[1])*60 + (+(m[2]||0)) : 9999; };
  sel.forEach(m => { m._min = hm(m.heure); m._pm = m._min !== 9999 && m._min >= 12*60 + 30 ? 1 : 0; });
  // Tri : jour → matin/après-midi → catégorie (U7 → Seniors) → heure
  sel.sort((a,b) => a._d-b._d || a._pm-b._pm || catRank(a.categorie)-catRank(b.categorie) || a._min-b._min);
  const items = []; let lastKey = "";
  for (const m of sel){
    const key = m._d.toDateString() + m._pm;
    if (key !== lastKey){ items.push({w:.75, head:true, html:`<div class="ghead">${esc(fmtDayLong(m._d))} · ${m._pm?"après-midi":"matin"}</div>`}); lastKey = key; }
    const club = CONFIG.CLUB_MATCH.test((m.domicile||"")+" "+(m.exterieur||""));
    const teams = m.exterieur
      ? `<div class="teams">${hl(m.domicile)}<span class="vs">–</span>${hl(m.exterieur)}</div>`
      : `<div class="teams free">${hlFree(m.domicile)}</div>`;
    const fin = m.fin ? `<small>→ ${esc(fmtHour(m.fin))}</small>` : "";
    const len = (m.exterieur ? 0 : (m.domicile||"").length);
    const lines = Math.max(1, Math.ceil(len / 95), Math.ceil((m.competition||"").length / 34), Math.ceil((m.stade||"").length / 34));
    items.push({w: 1 + (lines - 1) * 0.42, html:
      `<div class="row ${club?"club":""}"><div class="hour">${esc(fmtHour(m.heure))}${fin}</div>
       <div class="cat"><span class="pill">${esc(m.categorie)}</span><div class="comp">${esc(m.competition||"")}</div></div>
       ${teams}<div class="venue">${esc(m.stade||"")}</div></div>`});
  }
  // un écran ne commence jamais par une ligne sans son titre de groupe
  const pages = paginate(items, 7.0).map((p, idx, arr) => {
    if (!p[0].html.startsWith('<div class="ghead"')){
      for (let j = idx-1; j >= 0; j--){ const h = [...arr[j]].reverse().find(x => x.html.startsWith('<div class="ghead"')); if (h){ p.unshift({w:.75, html:h.html.replace("</div>"," (suite)</div>")}); break; } }
    }
    return p;
  });
  return pages.map((p, i) => head("Agenda des rencontres", sub || "", i, pages.length) + p.map(x=>x.html).join(""));
}

function slidesResultats(){
  const t0 = today0(), tStart = new Date(t0); tStart.setDate(tStart.getDate() - CONFIG.RESULTS_DAYS_BACK);
  let list = (DATA.resultats||[]).map(r => ({...r, _d: parseDate(r.date)})).filter(r => r._d && r.scoredom !== "" && r.scoreext !== "");
  if (!isDemo) list = list.filter(r => r._d >= tStart && r._d <= t0);
  if (!list.length) return [];
  list.sort((a,b) => b._d-a._d || catRank(a.categorie)-catRank(b.categorie));
  const items = list.map(r => {
    const sd = +r.scoredom, se = +r.scoreext;
    const home = CONFIG.CLUB_MATCH.test(r.domicile), away = CONFIG.CLUB_MATCH.test(r.exterieur);
    let tag = "";
    if (home || away){ const us = home ? sd : se, them = home ? se : sd; tag = us>them?"V":us<them?"D":"N"; }
    return {w:1, html:`<div class="res" style="${tag?"border-left-color:var(--y)":""}"><div class="dt">${esc(fmtDayShort(r._d))}</div>
      <div class="cat"><span class="pill">${esc(r.categorie)}</span>${r.competition?`<div class="comp">${esc(r.competition)}</div>`:""}</div>
      <div class="tm l">${hl(r.domicile)}</div><div class="score">${esc(r.scoredom)} – ${esc(r.scoreext)}</div>
      <div class="tm">${hl(r.exterieur)}</div><div>${tag?`<div class="tag ${tag}">${tag}</div>`:""}</div></div>`};
  });
  const pages = paginate(items, 6);
  const win = list.some(r => { const h = CONFIG.CLUB_MATCH.test(r.domicile), a = CONFIG.CLUB_MATCH.test(r.exterieur);
    return (h && +r.scoredom > +r.scoreext) || (a && +r.scoreext > +r.scoredom); });
  const masc = (n) => (win && CONFIG.MASCOT_URL && n <= 5) ? `<img class="mascot m-results" src="${CONFIG.MASCOT_URL}" alt="">` : "";
  return pages.map((p,i) => head("Résultats", "Derniers matchs", i, pages.length) + `<div class="${masc(p.length)?"with-masc":""}">` + p.map(x=>x.html).join("") + `</div>` + masc(p.length));
}

  let one = list.map(r => {
    const sd = +r.scoredom, se = +r.scoreext, h = CONFIG.CLUB_MATCH.test(r.domicile), a = CONFIG.CLUB_MATCH.test(r.exterieur);
    let tag = ""; if (h || a){ const us = h ? sd : se, them = h ? se : sd; tag = us>them?"V":us<them?"D":"N"; }
    return `<div class="ri"><span class="c">${esc(r.categorie)}</span><span>${hl(r.domicile)}</span><span class="sc">${esc(r.scoredom)}-${esc(r.scoreext)}</span><span>${hl(r.exterieur)}</span>${tag?`<span class="r ${tag}"></span>`:""}</div>`;
  }).join("");
  while ((one.match(/class="ri"/g)||[]).length < 6) one += one;
  tr.innerHTML = one + one;
  tr.style.animationDuration = Math.max(30, (one.match(/class="ri"/g)||[]).length * 9) + "s";
}
function renderFooter(){
  renderTicker();
  const ps = (DATA.partenaires||[]).filter(p => p.nom || p.logo);
  const tr = $("track");
  if (!ps.length){ tr.style.animation = "none"; tr.innerHTML = `<div class="welcome">Bienvenue au club house du ${esc(CONFIG.CLUB_NAME)} !</div>`; return; }
  let one = ps.map(p => partnerHTML(p,"logo")).join("");
  while ((one.match(/class="logo"/g)||[]).length < 8) one += one;  // remplit la largeur
  tr.innerHTML = one + one;
  tr.style.animation = ""; tr.style.animationDuration = Math.max(25, (one.match(/class="logo"/g)||[]).length * 5) + "s";
}

/* ===================== ROTATION ===================== */
let slides = [], idx = -1, timer = null;
function build(){
  slides = [{html:slideAccueil(), nowm:true}, ...slidesDuJour(), ...slidesMatchs(), ...slidesResultats(), ...slidesRDV(), ...slidesAnnonces()];
  if (!slides.length) slides = [`<div class="empty">Bienvenue au club house du ${esc(CONFIG.CLUB_NAME)} !<br><br>Aucune information à afficher pour le moment.</div>`];
  renderFooter();
  $("demo").style.display = isDemo ? "block" : "none";
}
function next(){
  idx++;
  if (idx >= slides.length){ idx = 0; build(); }
  const box = $("slides");
  const old = box.querySelector(".slide.on");
  const el = document.createElement("div");
  const sl = typeof slides[idx] === "string" ? {html: slides[idx]} : slides[idx];
  el.className = "slide " + (sl.cls || ""); el.innerHTML = sl.html;
  box.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
  if (old){ old.classList.remove("on"); setTimeout(() => old.remove(), 900); }
  const p = $("progress");
  p.style.transition = "none"; p.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = `width ${sl.sec || CONFIG.SLIDE_SECONDS}s linear`; p.style.width = "100%"; }));
  $("wm").style.opacity = sl.nowm ? 0 : "";
  timer = setTimeout(next, (sl.sec || CONFIG.SLIDE_SECONDS) * 1000);
}

/* ===================== HORLOGE & MÉTÉO ===================== */
function tick(){
  const d = nowLocal();
  $("time").textContent = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  $("date").textContent = `${fmtDayLong(d)} ${d.getFullYear()}`;
}
const WMO = c => c===0?["☀️","Ensoleillé"]:c<=2?["🌤️","Éclaircies"]:c===3?["☁️","Couvert"]:c<=48?["🌫️","Brouillard"]:c<=57?["🌦️","Bruine"]:c<=67?["🌧️","Pluie"]:c<=77?["🌨️","Neige"]:c<=82?["🌦️","Averses"]:["⛈️","Orages"];
async function weather(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=${encodeURIComponent(CONFIG.TIMEZONE)}&forecast_days=1`;
    const j = await (await fetch(u)).json();
    const [ico, lab] = WMO(j.current.weather_code);
    $("weather").innerHTML = `<div class="ico">${ico}</div><div><div class="t">${Math.round(j.current.temperature_2m)}°</div></div>
      <div class="d">${lab}<br>${Math.round(j.daily.temperature_2m_min[0])}° / ${Math.round(j.daily.temperature_2m_max[0])}° · pluie ${j.daily.precipitation_probability_max[0] ?? 0}%</div>`;
    const hm = t => String(t||"").slice(11,16).replace(":", "h");
    if (j.daily.sunrise && j.daily.sunset) $("sun").innerHTML =
      `<div><span class="si">☀️</span>${hm(j.daily.sunrise[0])}</div><div><span class="si">🌙</span>${hm(j.daily.sunset[0])}</div>`;
  }catch(e){ /* pas de météo : on n'affiche rien */ }
}

/* ===================== MUSIQUE DE FOND ===================== */
function startMusic(){
  if (new URLSearchParams(location.search).get("son") === "0") return;
  const cand = Array.from({length: CONFIG.MUSIC_MAX_FILES}, (_, i) => `musique${i+1}.mp3`);
  // on vérifie quels fichiers existent vraiment, puis on les joue en boucle dans un ordre aléatoire
  Promise.all(cand.map(src => new Promise(ok => {
    const a = new Audio(); a.preload = "metadata";
    a.onloadedmetadata = () => ok(src); a.onerror = () => ok(null); a.src = src;
    setTimeout(() => ok(null), 8000);
  }))).then(found => {
    const list = found.filter(Boolean);
    if (!list.length) return;
    for (let i = list.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [list[i], list[j]] = [list[j], list[i]]; }
    const player = new Audio(); player.volume = CONFIG.MUSIC_VOLUME;
    let k = 0, fails = 0;
    const play = () => { player.src = list[k % list.length]; player.play().catch(() => armUnlock()); };
    player.onended = () => { k++; fails = 0; play(); };
    player.onerror = () => { if (++fails < list.length){ k++; play(); } };
    // si le navigateur bloque la lecture automatique, le son démarre au premier appui sur la télécommande
    const armUnlock = () => { const go = () => { player.play().catch(()=>{}); removeEventListener("keydown", go); removeEventListener("click", go); };
      addEventListener("keydown", go); addEventListener("click", go); };
    play();
  });
}

/* ===================== MISE À L'ÉCHELLE (TV 16:9) ===================== */
// Marge de sécurité réglable dans l'adresse : ...ecran-parfin/?marge=5  (en %, pour les TV qui rognent les bords)
const MARGE = Math.max(0, Math.min(20, parseFloat(new URLSearchParams(location.search).get("marge")) || 0));
function viewSize(){
  // la taille réellement visible, quelle que soit la façon dont le navigateur de la TV la déclare
  const vv = window.visualViewport;
  const w = Math.min(...[vv && vv.width, document.documentElement.clientWidth, innerWidth].filter(x => x > 0));
  const h = Math.min(...[vv && vv.height, document.documentElement.clientHeight, innerHeight].filter(x => x > 0));
  return [w, h];
}
function fit(){
  const [W, H] = viewSize();
  const k = 1 - MARGE/50;               // marge des deux côtés
  const s = Math.min(W/1920, H/1080) * k;
  const st = $("stage");
  st.style.transform = `scale(${s})`;
  st.style.left = (W - 1920*s)/2 + "px";
  st.style.top = (H - 1080*s)/2 + "px";
}

/* ===================== DÉMARRAGE ===================== */
(async function init(){
  fit(); addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
  addEventListener("load", fit); setTimeout(fit, 1500); setInterval(fit, 10000);
  $("clubName").textContent = CONFIG.CLUB_NAME;
  $("clubSub").textContent = CONFIG.CLUB_SUBTITLE;
  if (CONFIG.CLUB_LOGO_URL){
    const src = driveImg(CONFIG.CLUB_LOGO_URL);
    $("crest").innerHTML = `<img src="${esc(src)}" alt="">`; $("crest").classList.add("logo");
    $("wm").style.backgroundImage = `url("${src}")`; $("wm").style.display = "block";
  }
  tick(); setInterval(tick, 1000);
  weather(); setInterval(weather, CONFIG.WEATHER_REFRESH_MINUTES*60000);
  await loadData(); build(); next();
  startMusic();
  setInterval(loadData, CONFIG.DATA_REFRESH_MINUTES*60000);   // les nouvelles données s'affichent au tour suivant
  // toutes les 5 minutes : si une nouvelle version a été mise sur GitHub, la page se recharge toute seule
  setInterval(async () => {
    try {
      const txt = await (await fetch(location.pathname + "?v=" + Date.now(), {cache: "no-store"})).text();
      const m = txt.match(/const APP_VERSION = "20261116-1642"]+)"/);
      if (m && m[1] !== APP_VERSION){ const q = new URLSearchParams(location.search); q.set("maj", m[1]); location.replace(location.pathname + "?" + q.toString()); }
    } catch(e){}
  }, 5 * 60000);
  // rechargement complet chaque nuit à 4h (au cas où la page aurait été modifiée)
  setInterval(() => { const d = nowLocal(); if (d.getHours()===4 && d.getMinutes()===0) location.reload(); }, 60000);
})();
</script>
